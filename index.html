<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator Inteligente de Agenda - UBS</title>
    <style>
        :root {
            --primary: #0056b3;
            --primary-dark: #003d80;
            --whatsapp: #25d366;
            --whatsapp-dark: #1ebe57;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #dcdcdc;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: #333;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        h2 { margin: 0; color: var(--primary); font-size: 20px; }
        .subtitle { margin: 2px 0 0 0; font-size: 13px; color: #666; }

        .config-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }

        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #495057; }
        .form-group input, .form-group select {
            padding: 7px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
        }

        textarea {
            width: 100%;
            height: 130px;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            resize: vertical;
            font-size: 13px;
        }

        .btn-group {
            margin-top: 12px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-ai { background: #6f42c1; color: white; }
        .btn-ai:hover { background: #59339d; }
        .btn-local { background: var(--primary); color: white; }
        .btn-local:hover { background: var(--primary-dark); }
        .btn-export { background: #198754; color: white; }
        .btn-export:hover { background: #146c43; }
        .btn-clear { background: #6c757d; color: white; }
        .btn-clear:hover { background: #5a6268; }

        .btn-wpp {
            background: var(--whatsapp);
            color: white;
            padding: 6px 12px;
            font-size: 12px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            display: inline-block;
        }
        .btn-wpp:hover { background: var(--whatsapp-dark); }

        .btn-copy-msg {
            background: #e9ecef;
            color: #333;
            padding: 6px 10px;
            font-size: 12px;
        }
        .btn-copy-msg:hover { background: #dee2e6; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }

        th {
            background-color: #f1f3f5;
            color: #333;
            text-align: left;
            padding: 10px;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:hover { background-color: #f8f9fa; }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            background: #e7f1ff;
            color: var(--primary);
        }

        .status-msg {
            font-size: 13px;
            font-weight: bold;
            margin-left: auto;
        }

        .enviado { opacity: 0.55; background-color: #f1f8f3 !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <div>
                <h2>Extrator de Agenda & Avisos (WhatsApp)</h2>
                <p class="subtitle">Separação rápida de pacientes para aviso de falta médica, remanejamento ou desistência</p>
            </div>
            <button class="btn-copy-msg" onclick="carregarExemplo()">Testar com Exemplo</button>
        </div>

        <!-- CONFIGURAÇÕES PADRÃO E API -->
        <div class="config-row">
            <div class="form-group">
                <label>Médico / Especialidade (Padrão caso não venha no texto):</label>
                <input type="text" id="defaultMedico" placeholder="Ex: Dr. Silva - Clínico Geral">
            </div>
            <div class="form-group">
                <label>Data da Consulta (Padrão caso não venha no texto):</label>
                <input type="text" id="defaultData" placeholder="Ex: 20/11/2026">
            </div>
            <div class="form-group">
                <label>Tipo de Aviso (Modelo de Mensagem):</label>
                <select id="tipoAviso" onchange="renderizarTabela()">
                    <option value="falta">Aviso de Falta / Cancelamento Médico</option>
                    <option value="vaga">Oferta de Vaga por Desistência (Encaixe)</option>
                    <option value="confirmacao">Confirmação de Consulta</option>
                </select>
            </div>
            <div class="form-group">
                <label>Chave API Gemini (Opcional - p/ textos muito bagunçados):</label>
                <input type="password" id="apiKey" placeholder="Cole sua API Key do Google AI Studio">
            </div>
        </div>

        <textarea id="rawAgenda" placeholder="Cole aqui a lista da agenda do e-SUS PEC (Ctrl+A, Ctrl+C na tela da agenda)..."></textarea>

        <div class="btn-group">
            <button class="btn-local" onclick="processarLocal()">⚡ Extrair Dados (Rápido / Offline)</button>
            <button class="btn-ai" onclick="processarComIA()">✨ Extrair com Inteligência Artificial</button>
            <button class="btn-clear" onclick="limparTudo()">Limpar</button>
            <span id="status" class="status-msg"></span>
        </div>
    </div>

    <!-- TABELA DE RESULTADOS -->
    <div class="card" id="resultadoCard" style="display: none;">
        <div class="header">
            <div>
                <h2>Pacientes Extraídos (<span id="contador">0</span>)</h2>
                <p class="subtitle">Clique no botão verde para abrir a mensagem pronta no WhatsApp</p>
            </div>
            <button class="btn-export" onclick="copiarParaPlanilha()">📋 Copiar Tabela (Excel / Sheets)</button>
        </div>

        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Data</th>
                        <th>Paciente</th>
                        <th>Telefone</th>
                        <th>Médico / Especialidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaCorpo"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let listaPacientes = [];

    // 1. EXTRATOR RÁPIDO LOCAL (REGEX INTELIGENTE PARA E-SUS)
    function processarLocal() {
        const texto = document.getElementById('rawAgenda').value.trim();
        if (!texto) {
            alert("Cole os dados da agenda primeiro.");
            return;
        }

        const defMedico = document.getElementById('defaultMedico').value.trim() || "Médico(a) da Unidade";
        const defData = document.getElementById('defaultData').value.trim() || "data agendada";

        // Tenta detectar data e médico globais no cabeçalho do texto colado
        const matchDataGlobal = texto.match(/\b(\d{2}\/\d{2}\/\d{4})\b/);
        const dataEncontradaGlobal = matchDataGlobal ? matchDataGlobal[1] : defData;

        const linhas = texto.split('\n').map(l => l.trim()).filter(l => l !== '');
        listaPacientes = [];

        // Regex para identificar padrões
        const regexHora = /\b([01]?\d|2[0-3]):[0-5]\d\b/;
        const regexTel = /(?:\(?\d{2}\)?\s*)?(?:9\d{4}|\d{4})[-\s]?\d{4}\b/g;
        const regexData = /\b\d{2}\/\d{2}\/\d{4}\b/;

        // Agrupa blocos por horário ou linha com telefone
        let registroAtual = null;

        for (let i = 0; i < linhas.length; i++) {
            const linha = linhas[i];
            const horaMatch = linha.match(regexHora);
            const telsMatch = linha.match(regexTel);
            const dataMatch = linha.match(regexData);

            // Se a linha começa com horário, inicia um novo paciente
            if (horaMatch && linha.indexOf(horaMatch[0]) < 10) {
                if (registroAtual && (registroAtual.telefone || registroAtual.nome)) {
                    listaPacientes.push(registroAtual);
                }
                registroAtual = {
                    hora: horaMatch[0],
                    data: dataMatch ? dataMatch[0] : dataEncontradaGlobal,
                    nome: limparNome(linha.replace(horaMatch[0], '')),
                    telefone: telsMatch ? telsMatch[0] : '',
                    medico: defMedico,
                    enviado: false
                };
            } else if (registroAtual) {
                // Complementa dados do registro atual nas linhas seguintes
                if (!registroAtual.telefone && telsMatch) {
                    registroAtual.telefone = telsMatch[0];
                }
                if (!registroAtual.nome && linha.length > 4 && !telsMatch && !dataMatch) {
                    registroAtual.nome = limparNome(linha);
                }
                if (dataMatch && registroAtual.data === defData) {
                    registroAtual.data = dataMatch[0];
                }
            } else if (telsMatch) {
                // Caso não tenha horário claro, mas tenha telefone na linha
                const nomePrev = (i > 0 && !linhas[i-1].match(regexTel)) ? limparNome(linhas[i-1]) : "Paciente";
                listaPacientes.push({
                    hora: horaMatch ? horaMatch[0] : "--:--",
                    data: dataMatch ? dataMatch[0] : dataEncontradaGlobal,
                    nome: nomePrev,
                    telefone: telsMatch[0],
                    medico: defMedico,
                    enviado: false
                });
            }
        }

        if (registroAtual && (registroAtual.telefone || registroAtual.nome)) {
            listaPacientes.push(registroAtual);
        }

        // Filtra apenas linhas válidas que tenham pelo menos telefone ou nome real
        listaPacientes = listaPacientes.filter(p => p.telefone !== '' || (p.nome && p.nome.length > 3));

        setStatus(`✅ ${listaPacientes.length} registros extraídos.`, "#198754");
        renderizarTabela();
    }

    function limparNome(str) {
        return str
            .replace(/\(?\d{2}\)?\s*\d{4,5}[-\s]?\d{4}/g, '')
            .replace(/\b\d{2}\/\d{2}\/\d{4}\b/g, '')
            .replace(/Agendado|Confirmado|Aguardando|Atendido|Faltou|CNS|CPF|\|/gi, '')
            .replace(/^[-–•\s]+|[-–•\s]+$/g, '')
            .trim();
    }

    // 2. EXTRATOR COM INTELIGÊNCIA ARTIFICIAL (GEMINI API)
    async function processarComIA() {
        const texto = document.getElementById('rawAgenda').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();

        if (!texto) {
            alert("Cole os dados da agenda primeiro.");
            return;
        }
        if (!apiKey) {
            alert("Para usar a IA avançada, insira sua chave API do Google AI Studio no campo acima, ou clique no botão azul 'Extrair Dados (Rápido / Offline)'.");
            return;
        }

        const defMedico = document.getElementById('defaultMedico').value.trim() || "Não informado";
        const defData = document.getElementById('defaultData').value.trim() || "Não informada";

        setStatus("⏳ Analisando agenda com IA...", "#6f42c1");

        const prompt = `Extraia todos os pacientes agendados do texto abaixo de uma agenda médica do SUS.
Retorne APENAS um array JSON válido (sem markdown, sem crases) no seguinte formato:
[{"nome": "Nome do Paciente", "telefone": "(15) 99999-9999", "data": "DD/MM/AAAA", "hora": "HH:MM", "medico": "Nome do Médico / Especialidade"}]

Regras:
- Se a data não estiver explícita no texto, use: "${defData}".
- Se o médico/especialidade não estiver explícito no texto, use: "${defMedico}".
- Padronize o telefone no formato (XX) XXXXX-XXXX. Se houver mais de um, pegue o celular.
- Ignore cabeçalhos de sistema e botões.

Texto da agenda:
${texto}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            const jsonText = data.candidates[0].content.parts[0].text;
            const extraidos = JSON.parse(jsonText);

            listaPacientes = extraidos.map(item => ({
                nome: item.nome || "Paciente",
                telefone: item.telefone || "",
                data: item.data || defData,
                hora: item.hora || "--:--",
                medico: item.medico || defMedico,
                enviado: false
            }));

            setStatus(`✨ IA extraiu ${listaPacientes.length} pacientes com sucesso!`, "#6f42c1");
            renderizarTabela();
        } catch (err) {
            console.error(err);
            setStatus("❌ Erro na IA. Tente o botão Extrair Rápido.", "#dc3545");
            alert("Erro ao conectar com a IA: " + err.message);
        }
    }

    // 3. GERADOR DE MENSAGEM E TABELA
    function gerarMensagem(p) {
        const tipo = document.getElementById('tipoAviso').value;
        const primeiroNome = p.nome.split(' ')[0] || "Paciente";

        if (tipo === 'falta') {
            return `Olá, *${primeiroNome}*! Aqui é da *UBS Elois Alves Correa*.\n\nInformamos que sua consulta com *${p.medico}*, agendada para o dia *${p.data}* às *${p.hora}*, precisou ser *cancelada* devido à ausência/imprevisto do profissional.\n\nPor favor, entre em contato ou compareça à recepção da unidade para realizarmos o reagendamento.`;
        } else if (tipo === 'vaga') {
            return `Olá, *${primeiroNome}*! Aqui é da *UBS Elois Alves Correa*.\n\nSurgiu uma vaga por desistência para consulta com *${p.medico}* no dia *${p.data}* às *${p.hora}*.\n\nVocê tem disponibilidade para comparecer nesse horário? Por favor, responda para confirmarmos.`;
        } else {
            return `Olá, *${primeiroNome}*! Aqui é da *UBS Elois Alves Correa*.\n\nPassando para confirmar sua consulta com *${p.medico}* no dia *${p.data}* às *${p.hora}*.\n\nCaso não possa comparecer, por favor nos avise com antecedência para cedermos a vaga a outro paciente.`;
        }
    }

    function renderizarTabela() {
        const card = document.getElementById('resultadoCard');
        const tbody = document.getElementById('tabelaCorpo');
        const contador = document.getElementById('contador');

        if (listaPacientes.length === 0) {
            card.style.display = 'none';
            return;
        }

        card.style.display = 'block';
        contador.textContent = listaPacientes.length;
        tbody.innerHTML = '';

        listaPacientes.forEach((p, idx) => {
            const numLimpo = p.telefone.replace(/\D/g, '');
            const numWpp = numLimpo.length >= 10 ? (numLimpo.startsWith('55') ? numLimpo : '55' + numLimpo) : '';
            const msg = gerarMensagem(p);
            const linkWpp = numWpp ? `https://wa.me/${numWpp}?text=${encodeURIComponent(msg)}` : '#';

            const tr = document.createElement('tr');
            if (p.enviado) tr.classList.add('enviado');

            tr.innerHTML = `
                <td><strong>${p.hora}</strong></td>
                <td>${p.data}</td>
                <td>${p.nome}</td>
                <td>${p.telefone || '<span style="color:#dc3545">Sem telefone</span>'}</td>
                <td><span class="badge">${p.medico}</span></td>
                <td style="white-space: nowrap;">
                    ${numWpp 
                        ? `<a href="${linkWpp}" target="_blank" class="btn-wpp" onclick="marcarEnviado(${idx})">📲 WhatsApp</a>` 
                        : `<span style="font-size:11px; color:#999;">Sem nº</span>`
                    }
                    <button class="btn-copy-msg" onclick="copiarMensagem(${idx})" title="Copiar texto da mensagem">Copiar Texto</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function marcarEnviado(idx) {
        listaPacientes[idx].enviado = true;
        renderizarTabela();
    }

    function copiarMensagem(idx) {
        const msg = gerarMensagem(listaPacientes[idx]);
        navigator.clipboard.writeText(msg);
        setStatus(`📋 Mensagem de ${listaPacientes[idx].nome} copiada!`, "#0056b3");
    }

    function copiarParaPlanilha() {
        let tsv = "Data\tHora\tPaciente\tTelefone\tMédico/Especialidade\n";
        listaPacientes.forEach(p => {
            tsv += `${p.data}\t${p.hora}\t${p.nome}\t${p.telefone}\t${p.medico}\n`;
        });
        navigator.clipboard.writeText(tsv);
        setStatus("📋 Tabela copiada! Cole (Ctrl+V) direto no Google Planilhas ou Excel.", "#198754");
    }

    function setStatus(texto, cor) {
        const el = document.getElementById('status');
        el.textContent = texto;
        el.style.color = cor;
    }

    function limparTudo() {
        document.getElementById('rawAgenda').value = '';
        listaPacientes = [];
        renderizarTabela();
        setStatus("", "#333");
    }

    function carregarExemplo() {
        document.getElementById('defaultMedico').value = "Dr. Carlos - Clínico Geral";
        document.getElementById('defaultData').value = "20/11/2026";
        document.getElementById('rawAgenda').value = 
`08:00 MARIA APARECIDA DA SILVA | Agendado
Telefone: (15) 99712-3456
08:20 JOSÉ ROBERTO OLIVEIRA | Confirmado
Celular: (15) 99644-8899
08:40 ANA CLARA SOUZA SANTOS | Agendado
(15) 99811-2233
09:00 PEDRO HENRIQUE LIMA
Telefone de contato: (15) 99755-6677`;
        processarLocal();
    }
</script>

</body>
</html>
